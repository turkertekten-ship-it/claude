# The documented request surface of POST /v1/messages, as a checkable list.
#
# This file exists because "is the parity matrix complete?" was, three times
# running, a question only answerable by me noticing something missing several
# turns later. Tool definitions were miscounted as covered; prompt caching and
# image input were absent entirely; then twelve parameters were unimplemented.
# Each was found by re-reading the API rather than by any mechanism.
#
# So the surface is written down, with where it came from, and
# `tools/api_surface_check.py` diffs it against what the backend actually
# emits. Completeness becomes a command that exits 0 or 1.
#
# When the API gains a parameter, this file is what goes stale. That is the
# intended failure mode: a stale snapshot is visible and fixable, whereas a
# stale belief is neither.

source: https://platform.claude.com/docs/en/api/messages
fetched: "2026-08-28"
method: WebFetch of the request-body schema, top-level parameters only

# Generally available. Every one must be reachable from a Request.
ga:
  - max_tokens
  - messages
  - model
  - cache_control
  - container
  - inference_geo
  - metadata
  - output_config
  - service_tier
  - stop_sequences
  - stream
  - system
  - thinking
  - tool_choice
  - tools
  - temperature
  - top_k
  - top_p

# Documented on their own pages rather than in the Messages request schema,
# and gated behind beta headers. Implemented, but not counted against GA
# coverage, because a beta parameter can be withdrawn without the schema
# changing.
beta:
  mcp_servers:
    header: mcp-client-2025-11-20
    source: https://platform.claude.com/docs/en/agents-and-tools/mcp-connector
  betas:
    note: sent as the anthropic-beta header, not a body field
  fallbacks:
    header: server-side-fallback-2026-07-01
  context_management:
    header: context-management-2025-06-27
  speed:
    header: fast-mode-2026-02-01
  task_budget:
    header: task-budgets-2026-03-13
    note: nests inside output_config, not top level
