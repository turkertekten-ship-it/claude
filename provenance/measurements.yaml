# Measurements this repository quotes, and the commands that produce them.
#
# The ledger in sources.yaml records what was seen and when. This records what
# must still be so: `tools/verify_measurements.py` re-runs every command below
# and fails when the number has moved. It exists because four of the six scores
# quoted in observations.md had drifted after fifteen loops of changes, and
# nothing in the repository could have noticed.
#
# Adding a number to a document means adding it here. `expect` is matched as a
# substring of the command's output.

measurements:
  - id: SCORE-BASE-OPERATOR
    command: "python3 tools/prompt_forge.py score --profile system prompts/base-operator.md"
    expect: "96/100"
    note: >-
      Measured 2026-08-28 by running the command above; not typed from memory.

  - id: SCORE-BUILDER
    command: "python3 tools/prompt_forge.py score --profile system prompts/builder.md"
