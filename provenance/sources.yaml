  - id: YOUTUBE-API-REACHABLE-2026-08-27
    kind: tool_output
    collected_at: "2026-08-27T15:02Z"
    method: "curl -sS -i https://www.googleapis.com/youtube/v3/videos?part=snippet&id=dQw4w9WgXcQ"
    evidence: >-
      Returned HTTP/2 403 from `server: scaffolding on HTTPServer2` with the
      JSON body {"error":{"code":403,"message":"Method doesn't allow
      unregistered callers (callers without established identity). Please use
      API Key or other form of API consumer identity to call this API.",
      "errors":[{"reason":"forbidden","domain":"global"}]}}. That is Google's
      own API responding through the proxy, not the proxy refusing the
      connection: compare www.youtube.com, which fails at CONNECT with
      "Tunnel connection failed: 403 Forbidden" and returns no body at all.
    note: >-
      This narrows PROXY-YOUTUBE-BLOCKED, which was second-hand. The hostname
      www.youtube.com is genuinely unreachable. The YouTube Data API v3 is
      reachable and returns a well-formed authorisation error, so the only
      thing standing between this container and YouTube metadata or caption
      tracks is an API key, not the egress policy.

