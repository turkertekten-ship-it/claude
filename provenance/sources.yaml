# Every factual claim recorded in this repository resolves to an id below.
#
# A source is something a later session can go back to and re-read: a commit, a
# file at a commit, or a command with its recorded exit status. "I remember" and
# "another agent said so" are not sources. A summary produced by another session
# may be recorded, but only with kind: report and a named reporter, so that its
# second-hand status travels with it.

sources:
  - id: S-1
    kind: repository
    ref: turkertekten-ship-it/claude
    commit: 1d7ce8f799f754a947df7c22da38491c3aa382a4
    subject: "Add zero-dependency core: HTTP client, web scraper, GitHub connector"
    committed_at: "2026-08-27T14:34:34+00:00"
    note: The tree this review's baseline observations were taken from.

  - id: S-2
    kind: file
    ref: turkertekten-ship-it/claude-ai CLAUDE.md
    commit: a21b4f4800b73af09ffd9eda4bb41d3be689056e
    subject: Point this repository at the shared operating doctrine
    committed_at: "2026-08-27T14:52:54+00:00"
    note: States the doctrine and names the directories it expects to exist here.

  - id: S-3
    kind: measurement
    command: make test
    cwd: pristine worktree of S-1
    exit_code: 2
    observed: "ImportError: Start directory is not importable: 'tests'"
    note: >-
      Taken in a detached worktree at S-1 rather than the working tree, because
      adding tests/ during this session changes the result. The re-measurement
      after that change is S-7.

  - id: S-4
    kind: measurement
    command: python3 -m oodarag.cli --help
    cwd: pristine worktree of S-1
    env: PYTHONPATH=src
    exit_code: 1
    observed: "ModuleNotFoundError: No module named 'oodarag.cli'"

  - id: S-5
    kind: measurement
    command: make lint
    cwd: pristine worktree of S-1
    exit_code: 0
    observed: python3 -m compileall -q src succeeded

  - id: S-6
    kind: measurement
    command: find src -name '*.py' | wc -l
    cwd: pristine worktree of S-1
    exit_code: 0
    observed: "16 python files, 2583 lines, across oodarag/{util,ingest,scrape}"

  - id: S-7
    kind: measurement
    command: python3 -m tools.ultrareview .
    cwd: working tree of this branch
    exit_code: 0
    observed: >-
      10 checkers run, 0 skipped, 0 error, 0 warn, 3 unverifiable.
      ZERO_DEP_CONFIRMED from the import graph, and TESTS_PASS with 292 tests
      collected and passed.
    note: >-
      The two unverifiable items are stated rather than folded into the pass:
      `make lint` was not executed because its recipe runs compileall, which
      writes bytecode into the tree under review; and link reachability was not
      checked because the network is off by default.

  - id: S-10
    kind: report
    reporter: the /ultrareview judgement layer (subagents, this session)
    command: four review dimensions, then one refutation agent per finding
    observed: >-
      31 findings raised, 30 survived adversarial refutation, 1 refuted.
      Each surviving finding was independently reproduced by its verifier
      before being accepted.
    note: >-
      Second-hand by construction - it is agents reporting on their own reading.
      It is recorded as kind:report rather than kind:measurement for that
      reason. Every finding acted on was re-derived here against the tree
      before the fix, and the fixes are covered by tests in the same commit.

  - id: S-9
    kind: measurement
    command: python3 -m tools.ultrareview ../claude-ai --sibling ../claude
    cwd: working tree of this branch
    exit_code: 0
    observed: "0 errors, 0 warnings over turkertekten-ship-it/claude-ai"
    note: >-
      The --sibling flag is required: claude-ai points at this repository on
      purpose, and without the sibling those references are reported
      unverifiable rather than guessed at in either direction.

  - id: S-8
    kind: measurement
    command: bash tests/run_all.sh
    cwd: working tree of this branch
    exit_code: 0
    observed: "compile, 292 unit tests, and the ten data checkers - all checks passed"
