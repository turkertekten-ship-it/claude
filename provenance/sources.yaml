  - id: SUBAGENT-SESSION-COLLISION-2026-08-27
    kind: filesystem
    collected_at: "2026-08-27T15:00Z"
    method: "head -1 on the main transcript and on a subagents/agent-*.jsonl, comparing the sessionId field"
    evidence: >-
