  - id: UNRELATED-HISTORIES-2026-08-27
    kind: repo_state
    collected_at: "2026-08-27T15:00Z"
    method: "git merge-base <two branches>; git rev-list --max-parents=0 <two branches>; comm -12 over their file listings"
    evidence: >-
      `git merge-base origin/claude/review-chat-archive-zrynr4
      origin/claude/rag-system-data-pipeline-rdkde9` printed nothing and exited
      1. `git rev-list --max-parents=0` returned both branch heads themselves
      (e37b4c2 and 1d7ce8f), so each branch is its own root commit and the two
      share no ancestry. Their file listings overlap on exactly two paths:
      .gitignore and README.md.

