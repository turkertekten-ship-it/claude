    collected_at: "2026-08-27T15:28Z"
    method: "git rev-list --max-parents=0 over all 5 branches of turkertekten-ship-it/claude-ai; git merge-base"
    evidence: >-
      All five branches on the `claude-ai` remote
      (review-chat-archive-zrynr4, goal-prompt-task-division-0ghozd,
      personal-skills-repos-research-dxmflq, great-euler-6tx6y6,
      code-playground-parity-xw0snj) return the same root commit a21b4f48, and
      `git merge-base` between them exits 0 at that commit. Each carries exactly
