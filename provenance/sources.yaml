  - id: MT-BENCH-MIRRORS-2026-08-27
    kind: tool_output
    collected_at: "2026-08-27T15:10Z"
    method: >-
      Delegated read of two independent GitHub full-text mirrors of arXiv
      2306.05685, plus the lm-sys/FastChat implementation the paper describes
    evidence: >-
      Judge consistency under swapped presentation order, default prompt:
      GPT-4 65.0%, GPT-3.5 46.2%, Claude-v1 23.8%. Repetitive-list verbosity
      attack failure rates: Claude-v1 91.3%, GPT-3.5 91.3%, GPT-4 8.7%
      (n = 23). Self-preference: GPT-4 ~10 points of win rate, Claude-v1 ~25,
      with the paper stating it "cannot determine whether the models exhibit a
      self-enhancement bias". Prescription quoted verbatim: "A conservative
      approach is to call a judge twice by swapping the order of two answers
      and only declare a win when an answer is preferred in both orders."
    note: >-
      SECOND-HAND and mirror-verified, not read from arxiv.org, which is
      blocked by this container's egress proxy. Two independent mirrors agreed
      exactly, and the described behaviour matches the FastChat source
      (play_a_match_pair runs both orders; show_result.py scores a
      disagreement as a tie). That is corroboration, not a reading of the
      canonical PDF. Treat the numbers as motivating the design, not as
      calibration constants.

