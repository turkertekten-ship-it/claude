  - id: DOCS-BESTPRACTICES-2026-08-27
    kind: tool_output
    collected_at: "2026-08-27T15:14Z"
    method: 'WebFetch("https://code.claude.com/docs/en/best-practices")'
    evidence: >-
      Page states, verbatim: "Most best practices are based on one constraint:
      Claude's context window fills up fast, and performance degrades as it
      fills." Its first section is titled "Give Claude a way to verify its
      work" and reads: "Claude stops when the work looks done. Without a check
      it can run, 'looks done' is the only signal available, and you become the
      verification loop: every mistake waits for you to notice it." It lists
      four escalating gates, verbatim: "In one prompt", "Across a session" (a
      /goal condition, where "A separate evaluator re-checks it after every
      turn"), "As a deterministic gate" (a Stop hook that "blocks the turn from
      ending until it passes"), and "By a second opinion" (a verification
      subagent, "so the agent doing the work isn't the one grading it"). Also:
      "Have Claude show evidence rather than asserting success". On CLAUDE.md:
      "For each line, ask: 'Would removing this cause Claude to make mistakes?'
      If not, cut it." On review: "A reviewer prompted to find gaps will
      usually report some, even when the work is sound, because that is what it
      was asked to do."
    note: >-
      First-party documentation, fetched and read directly by this session.
      Verified. Independently corroborates the central claim of the Cherny
      corpus without going through the compilation.

