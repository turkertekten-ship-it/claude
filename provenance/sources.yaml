  - id: CLI-UNDOCUMENTED-FLAGS-2026-08-27
    kind: tool_output
    collected_at: "2026-08-27T15:50Z"
    method: >-
      Probing the CLI parser directly with candidate flag names, then a live
      call with --thinking adaptive --max-thinking-tokens 2048
    evidence: >-
      `--thinking <mode>`, `--max-thinking-tokens <tokens>` and
      `--task-budget <tokens>` are accepted by the parser (they fail with
      "argument missing", not "unknown option") and appear nowhere in the 242
      lines of `claude --help`. `--temperature`, `--top-p`, `--top-k`,
      `--stop-sequences` and `--max-tokens` are rejected as unknown options
      under every spelling probed. Two otherwise identical haiku calls reported
      thinking_tokens 37 with a 2048 budget and 89 without one, so the flag
      changes behaviour rather than being accepted and ignored.
    note: >-
      Undocumented means unsupported: these may change without notice. The
      workbench uses them and `workbench doctor` labels them as undocumented
      rather than presenting them as a stable interface.
