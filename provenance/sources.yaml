  - id: CLI-BACKEND-2026-08-27
    kind: tool_output
    collected_at: "2026-08-27T14:57Z"
    method: >-
      claude -p "Reply with exactly the word: PONG" --output-format json
      --model claude-haiku-4-5-20251001, run twice: once with the default
      surface, once with --system-prompt ... --tools "" --setting-sources ""
    evidence: >-
      Both calls returned result "PONG". The default invocation reported
      total_cost_usd 0.064242 with cache_creation_input_tokens 31513 and
      input_tokens 10. The stripped invocation reported total_cost_usd 0.001514
      with input_tokens 250 and no cache creation. The JSON envelope carries
      result, usage, total_cost_usd, modelUsage, session_id, num_turns,
      stop_reason and duration_ms. A separate call with --json-schema returned
      a parsed object under the key structured_output.
    note: >-
      Establishes that the Claude Code CLI is a usable completion backend with
      its own cost accounting, and that stripping the coding-agent surface is
      worth roughly 42x on a short prompt. No ANTHROPIC_API_KEY is present in
      this container, so this is the only backend available.

