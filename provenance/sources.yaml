      Claude, you can use `claude --dangerously-skip-permissions` to bypass all
      permission checks and let Claude keep going until it produces a result."
      2026-01-03 tips, tip 10: "Don't use `--dangerously-skip-permissions`.
      Instead, use `/permissions` to pre-allow common bash commands that you
      know are safe in your environment". The 2026-04-16 tips then describe auto
      mode, routing permission prompts to a model-based classifier, as "a safer
      alternative" to that flag.
    note: >-
      RETRACTED 2026-08-27. This entry claimed a reversal. It was wrong, and the
