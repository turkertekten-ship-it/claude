  - id: ROLE-ATTRIBUTION-BUG-2026-08-27
    kind: tool_output
    collected_at: "2026-08-27T15:17Z"
    method: "python3 tools/ingest_chat_archive.py search 'reverse engineer' over the real transcript; then reading parse_claude_code_jsonl"
    evidence: >-
      A search for "reverse engineer" returned three hits all labelled
      `user`, of which two were Bash tool output ("Exit code 128 ... fatal: your
      current branch ... does not have any commits yet") and none was typed by
      the owner. Cause: Claude Code writes tool results as records with
      `type: "user"` and `message.role: "user"`, and the ingester took that
      field at face value. Fixed by deriving the role from the content blocks -
      a record whose blocks are exclusively `tool_result` is filed as
      `tool_result` - and by adding a `--role` filter to search. After the fix,
      `search "ooda" --role user` returned 2 hits, both the owner's own goal
      text. A regression case was added to tests/test_ingest_chat_archive.py in
      which the same term appears in both the owner's message and the tool
      output, and the filter must keep the former and drop the latter;
      `bash tests/run_all.sh` prints "ALL CHECKS PASSED".
