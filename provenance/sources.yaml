  - id: TABLES-RECOVERABLE-2026-08-27
    kind: tool_output
    collected_at: "2026-08-27T17:40Z"
    method: "pdfplumber 0.11.10 extract_tables with default, text/text and text/lines strategies over a generated ruled table PDF; pdftoppm -r 200 then tesseract with the tsv output mode over the same document"
    evidence: >-
      With the default line-based strategy pdfplumber found 0 tables, because
      the test document has horizontal rules and no vertical ones. With
      vertical_strategy and horizontal_strategy both set to "text" it returned
      one table with the correct grid - ['Clause','Cap','Survival'],
      ['7.2','20%','18 mont'], ['7.3','100%','36 mont'] - interleaved with
      empty rows, and with the final cell clipped at the inferred column
      boundary. Plain text extraction from the same page was exact.
      Tesseract's tsv mode over the rasterised page returned word-level boxes
      whose left coordinates cluster at 71, 335 and 599 and whose tops cluster
      at 116, 201 and 284, matching the three columns and three rows; "18" and
      "months" are separate words at left 599 and 642.
    note: >-
      Narrows the U-9 residue considerably. Born-digital table structure IS
      recoverable with pdfplumber's text strategy, imperfectly - cells clip at
      inferred boundaries and phantom empty rows appear, so it needs
      validation rather than trust. Scanned table structure is reconstructible
      in principle, because tesseract's tsv output carries the geometry, but
      that requires clustering words into column and row bands and is not
      available off the shelf. What genuinely remains unavailable is a trained
      table-structure model of TableFormer's kind, for merged cells, spanning
      headers and complex layouts.
