      .../subagents/agent-a61cb96d1a200c0a2.jsonl both report
      sessionId=39f45f12-0454-50a5-8115-31fff3e1bbf0. A subagent transcript
      carries its parent's sessionId, so sessionId alone does not identify a
      transcript.

