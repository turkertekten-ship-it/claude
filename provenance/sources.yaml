# Provenance ledger.
#
# Every factual claim in an enforced document must cite one of these ids as
# [src:ID]. Adding a claim without a source, or citing an id that is not
# listed here, fails `python3 tools/verify_provenance.py`.
#
# Required fields per entry: id, kind, collected_at, method, evidence
#   kind: one of tool_output | filesystem | api | user_statement | repo_state
#   evidence: a path under provenance/raw/, or a verbatim excerpt.

sources:
  - id: SESSIONS-2026-08-27
