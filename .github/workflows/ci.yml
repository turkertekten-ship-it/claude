name: ci

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

# Superseded runs are cancelled, so only the *tip* of a branch is guaranteed to
# have been verified - an intermediate commit pushed and then quickly followed
# by another may have no completed run at all.
#
# The trap that matters when reading this history: a cancelled run reports
# **zero failed jobs**. Any check phrased as "were there failures?" - including
# the GitHub API's failed-jobs queries - answers no for a run that never
# finished, which is indistinguishable from success. Assert
# `conclusion == "success"`, never the absence of failures (LEARNINGS L55).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # No install step and no dependency cache, deliberately: the core runs on
      # the standard library, and a green build here is evidence of that claim.
      - name: Compile every module
        run: python -m compileall -q src tests

      - name: Test suite
        env:
          PYTHONPATH: src
          # Live cross-checks against GitHub skip cleanly without a token; they
          # run on push to this repository, where one is available.
          OODARAG_SKIP_NETWORK_TESTS: ${{ github.event_name == 'pull_request' && '1' || '' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m unittest discover -s tests -v

  numpy-path:
    # store/vectors.py has two scoring kernels. The pure-Python one is covered
    # by the job above; this proves the accelerated path agrees with it.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --quiet numpy
      - env:
          PYTHONPATH: src
          OODARAG_SKIP_NETWORK_TESTS: "1"
        run: python -m unittest discover -s tests -v

  retrieval-quality:
    # The regression gate. A change that makes retrieval worse fails here even
    # when every unit test still passes - which is exactly how the three real
    # retrieval bugs in internal/LEARNINGS.md were caught.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Index this repository
        env:
          PYTHONPATH: src
        run: python -m oodarag.cli index
      - name: Evaluate retrieval
        env:
          PYTHONPATH: src
        run: |
          # The primary corpus is a weak gate and getting weaker: it now
          # documents its own evaluation, so its top results for a golden
          # question are the files written *about* that question. Kept as a
          # smoke test and a contamination demonstrator, with a loose floor.
          # The external corpus below is the real regression gate.
          # Ratcheted 0.80 -> 0.85 when the pass rate reached 18/20. A floor
          # left where it was after an improvement lets the gain erode
          # silently; a floor moved up locks it in. 17/20 = 0.85 still passes,
          # so this tolerates exactly one regression, which is the intent.
          python -m oodarag.cli eval \
            --exclude-source chat \
            --min-pass-rate 0.85 \
            --out eval-report.md
      - name: Evaluate against the held-out set
        run: |
          # Reported, deliberately barely gated. This set exists to detect
          # overfitting in the *other* gates, and a tight floor here would turn
          # it into one more thing to tune against - which is exactly what it
          # was built not to be (LEARNINGS L67). The floor catches catastrophe
          # and nothing finer.
          PYTHONPATH=src python3 -m oodarag.cli --config oodarag-external.toml eval \
            --goldens evals/goldens-heldout.jsonl --min-pass-rate 0.6

      - name: Evaluate against the external corpus
        # No self-reference, so contamination is clean and the numbers need no
        # quarantine. This set catches abstention failures the primary corpus
        # cannot see, because the primary corpus contains the very words that
        # make an out-of-corpus question look answerable.
        env:
          PYTHONPATH: src
        run: |
          python -m oodarag.cli --config oodarag-external.toml index
          # Ratcheted 0.85 -> 0.86 at 48/54 = 0.889. 47/54 = 0.870 passes and
          # 46/54 = 0.852 fails, so one regression is tolerated and two are
          # not - the same tightness the floor had before the corpus grew.
          python -m oodarag.cli --config oodarag-external.toml eval \
            --goldens evals/goldens-external.jsonl \
            --min-pass-rate 0.86 --out eval-external.md

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-report
          path: |
            eval-report.md
            eval-external.md
