# oodarag configuration.
# Everything here has a working default; this file exists to declare sources.

[oodarag]
index_path    = ".oodarag/index.db"
state_path    = ".oodarag/state.json"
goldens_path  = "evals/goldens.jsonl"
embedder      = "hashing"          # deterministic, offline, zero-dependency
generator     = "auto"             # Claude when available, extractive otherwise
top_k         = 8
repo_slugs    = ["turkertekten-ship-it/claude", "turkertekten-ship-it/claude-ai"]

[oodarag.embedder_options]
dim = 768

# --- This repository: the code and the internal docs are the primary corpus.
[[source]]
type     = "filesystem"
root     = "."
patterns = ["src/**/*.py", "tests/**/*.py", "docs/**/*.md", "internal/**/*.md", "*.md"]
authority = 1.2

# --- Reference notes: authored design notes, with sources cited inline.
[[source]]
type      = "filesystem"
root      = "corpus/reference"
patterns  = ["**/*.md"]
authority = 1.0

# --- IBM Technology video manifest. Ingests as metadata-only wherever
# youtube.com is unreachable, and hydrates real captions where it is.
# Run `ooda preflight` to find out which case you are in.
[[source]]
type      = "youtube"
manifest  = "corpus/ibm-technology/manifest.json"
authority = 0.85

# --- Session transcripts: decisions and reasoning that exist nowhere else.
# Tool output and reasoning blocks are excluded by default - see ingest/chat.py.
[[source]]
type = "chat"
authority = 0.9

# --- The remote repository, for issues, PRs and releases that are not on disk.
# Disabled by default: it costs API quota and duplicates the filesystem source
# for files. Enable it when you want the discussion, not just the code.
[[source]]
type    = "github"
enabled = false
owner   = "turkertekten-ship-it"
repo    = "claude"
resources = ["repo", "issues", "pulls", "releases"]

# --- Web sources. Seeds must be reachable from wherever this runs:
# run `ooda preflight` first, and see internal/CAPABILITY-PROTOCOL.md.
[[source]]
type    = "web"
enabled = false
seeds   = ["https://pypi.org/project/requests/"]
max_pages = 20
max_fetches = 60
max_depth = 2
authority = 0.8
